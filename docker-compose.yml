version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: kruze
      POSTGRES_PASSWORD: kruze
      POSTGRES_DB: kruze
    ports:
      - "5432:5432"
    volumes:
      - kruze_postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  kruze_postgres_data:
